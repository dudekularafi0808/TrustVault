<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer glowing shield outline -->
  <path d="M60 8 L105 26 C105 72 60 110 60 110 C60 110 15 72 15 26 Z" 
        fill="url(#bgGrad)" 
        stroke="url(#shieldGrad)" 
        stroke-width="3.5" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Inner vault circle dial -->
  <circle cx="60" cy="56" r="28" fill="none" stroke="#1e293b" stroke-width="6"/>
  <circle cx="60" cy="56" r="28" fill="none" stroke="url(#shieldGrad)" stroke-width="2.5" stroke-dasharray="14 6"/>

  <!-- Vault spokes -->
  <line x1="60" y1="28" x2="60" y2="40" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="72" x2="60" y2="84" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="56" x2="44" y2="56" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="76" y1="56" x2="88" y2="56" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Center Vault Core & Keyhole -->
  <circle cx="60" cy="56" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="60" cy="52" r="4.5" fill="#10b981"/>
  <polygon points="58,52 62,52 64,63 56,63" fill="#10b981"/>

  <!-- Digital Nodes / Verification Dots -->
  <circle cx="60" cy="18" r="3" fill="#38bdf8"/>
  <circle cx="92" cy="36" r="2.5" fill="#06b6d4"/>
  <circle cx="28" cy="36" r="2.5" fill="#06b6d4"/>
  <circle cx="60" cy="98" r="3" fill="#10b981"/>
</svg>
